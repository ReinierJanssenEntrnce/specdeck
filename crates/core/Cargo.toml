[package]
name = "specdeck-core"
description = "SpecDeck session engine for hosts and viewers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
specdeck-protocol.workspace = true
datachannel = { version = "0.16", features = ["vendored"] }
futures-util = "0.3"
getrandom = "0.4"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
alacritty_terminal = "0.26"
axum = "0.8"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "net", "macros", "time", "io-util"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
which = "8"

[dev-dependencies]
specdeck-signalling = { path = "../signalling" }
env_logger = "0.11"
