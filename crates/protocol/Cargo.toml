[package]
name = "specdeck-protocol"
description = "SpecDeck wire protocol: messages, frames, signing and invite codes"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ed25519-dalek = "3"
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
postcard = { version = "1", features = ["alloc"] }
sha2 = "0.11"
thiserror = "2"
zstd = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
