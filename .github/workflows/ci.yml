name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # Tools pinned in mise.toml: Rust, Node, pnpm, just, cmake.
      - uses: jdx/mise-action@v3

      - uses: Swatinem/rust-cache@v2

      - run: just install

      - run: just check

      - run: just package

      - name: Check installer size
        shell: bash
        run: scripts/check-installer-size.sh 25 target/release/bundle

      - uses: actions/upload-artifact@v5
        with:
          name: installers-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error

  # The flake builds SpecDeck from source (design decision 13); a dependency change that breaks
  # the Nix build shows up here rather than for Nix users.
  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix build .#default -L
      - name: The binary starts
        run: xvfb-run --auto-servernum timeout 15 ./result/bin/specdeck-app || [ $? -eq 124 ]
