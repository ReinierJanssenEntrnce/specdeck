name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by renovate-nix-hash.yml for the commit it pushes, which starts no workflow itself.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # Tools pinned in mise.toml: Rust, Node, pnpm, just, cmake.
      - uses: jdx/mise-action@v3

      # Also saved when a later step fails: otherwise every failing run starts cold.
      # Saved from main only: PRs restore main's cache. Each OS's cache is 1.2-1.7 GB, so PR copies
      # pushed the total past GitHub's 10 GB and got caches evicted, which made runs start cold.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: just install

      - run: just check

      # session-streaming: Session capacity. A measurement, so it runs on its own after the tests,
      # in a step rather than a job so it shares this job's Rust cache. Reported, not enforced, for
      # now: on Ubuntu runners 20 viewers added 15 to 110 ms to the host's echo between runs, even
      # alone, while macOS and Windows showed almost nothing; that cost is still being looked into.
      - name: Capacity (20 viewers)
        continue-on-error: true
        run: just capacity

      - run: just package

      - name: Check installer size
        shell: bash
        run: scripts/check-installer-size.sh 25 100 target/release/bundle

      - uses: actions/upload-artifact@v5
        with:
          name: installers-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error
