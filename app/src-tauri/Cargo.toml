[package]
name = "specdeck-app"
description = "SpecDeck desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "specdeck_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
specdeck-core.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
window-vibrancy = "0.8"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
specdeck-protocol.workspace = true
# Only for the error type of the service check; the connection itself is specdeck-core's.
tokio-tungstenite = { version = "0.30", default-features = false }

[dev-dependencies]
tempfile = "3"
specdeck-signalling = { path = "../../crates/signalling" }
